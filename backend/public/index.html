<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Backend | Status</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-primary: #ffffff;
            --accent-color: #00ff88;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 3rem;
            border-radius: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p {
            font-size: 1.1rem;
            color: #888;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 2s infinite;
        }

        .routes-list {
            margin-top: 2rem;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 12px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.85rem;
        }

        .route-item {
            margin-bottom: 0.5rem;
            color: #ddd;
        }

        .method {
            color: var(--accent-color);
            font-weight: bold;
            margin-right: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(0, 255, 136, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 136, 0);
            }
        }

        /* Decorative background spheres */
        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
        }

        .sphere-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-color);
            top: -100px;
            left: -100px;
        }

        .sphere-2 {
            width: 300px;
            height: 300px;
            background: #8800ff;
            bottom: -50px;
            right: -50px;
        }
    </style>
</head>

<body>
    <div class="sphere sphere-1"></div>
    <div class="sphere sphere-2"></div>

    <div class="container">
        <div class="status-badge">
            <div class="status-dot"></div>
            System Online
        </div>
        <h1>Break Backend</h1>
        <p>A high-performance Express server initialized and ready for experimentation. Seamlessly hosted and
            beautifully architected.</p>

        <div class="routes-list">
            <div class="route-item text-center">Available Routes:</div>
            <div class="route-item"><span class="method">GET</span> /api/cars (List All)</div>
            <div class="route-item"><span class="method">POST</span> /api/cars (Create)</div>
            <div class="route-item"><span class="method">PUT</span> /api/cars/:id (Update)</div>
            <div class="route-item"><span class="method">DELETE</span> /api/cars/:id (Delete)</div>
            <div class="route-item"><span class="method">GET</span> /api/health</div>
        </div>
    </div>
</body>

</html>
